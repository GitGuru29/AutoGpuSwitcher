# GPU-heavy application classifier.
#
# This file is sourced by analyzer/scripts/common.sh. Each array is a list of
# case-insensitive glob patterns (package names) or exact category names
# (desktop entry Categories= values). Override it with
# AUTOGPUSWITCHER_CLASSIFIER_FILE if you need site-specific rules.
#
# The goal is precision, not coverage: a binary that merely links libGL is not
# automatically a game. Desktop-category evidence is required unless the
# package name is a known benchmark or game launcher.

# Desktop categories that are strong evidence of a GPU-heavy workload.
HEAVY_CATEGORIES=(
    Game
    Benchmark
    Graphics
    2DGraphics
    3DGraphics
    VectorGraphics
    RasterGraphics
    Photography
)

# Categories that make a desktop entry a utility even if it also links GL.
EXCLUDED_CATEGORIES=(
    Utility
    System
    Settings
    DesktopSettings
    Development
    FileManager
    TerminalEmulator
    TextEditor
    Network
    Office
    Audio
    Qt
    KDE
    ConsoleOnly
    Viewer
)

# Benchmarks / diagnostic tools that link GL but are not games. These are
# matched by package name so they work even without a desktop entry.
BENCHMARK_PACKAGES=(
    gputest
    unigine-*
    vkmark
    glmark2
    glmark2-*
    *benchmark*
)

# Game launchers, emulators, and compatibility layers. Keep this list to
# well-known names; unknown games should be added to manual_heavy_apps.list.
GAME_LAUNCHER_PACKAGES=(
    steam
    lutris
    heroic-*
    bottles
    itch
    itch-*
    prismlauncher
    multimc
    minecraft-launcher
    retroarch
    dolphin-emu
    ppsspp
    pcsx2
    rpcs3
    ryujinx
    yuzu
    cemu
    duckstation
    xemu
    melonds
    mupen64plus
    scummvm
    dosbox
    dosbox-staging
    wine
    proton
    proton-ge-custom
)

# Desktop utilities/compositors that must never be auto-routed on their own.
# Only exact/glob names here; do not use broad prefixes that could catch games.
EXCLUDED_PACKAGES=(
    hyprland
    xwayland
    dolphin
    baloo
    pavucontrol-qt
    pinentry
    polkit-kde-agent
    zxing-cpp
    gtk3
    gtk4
)
